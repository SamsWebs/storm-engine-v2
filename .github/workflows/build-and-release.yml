name: Build And Release Multiplatform

on:
  push:
    # Releases come from a deliberately pushed tag, never from a merge.
    #
    # This used to also trigger on pushes to main, where the version job bumped
    # the patch from the newest tag and pushed it. That made every merge a
    # release, and it derived the number from tag history rather than from what
    # the tree says it is - so merging a set of BREAKING changes published them
    # as a patch, telling consumers it was safe to relink when relinking would
    # hand them misaligned memory. It happened: v1.3.2 was auto-created over the
    # 2.0.0 wave-one merge and had to be deleted before anyone fetched it.
    #
    # pr-validate.yml still builds and tests every PR, but only linux/amd64 in
    # a debug profile. The arm64/QEMU leg, the release-profile build, strip,
    # DESTDIR staging and the dpkg-shlibdeps Depends check now run for the
    # first time at tag push rather than on every merge -- so a break in those
    # surfaces when you cut a release instead of when you open the PR. That is
    # a real trade: worth a scheduled packaging run or extending pr-validate to
    # the matrix. Tracked in docs/ROADMAP.md.
    tags:
      - 'v*.*.*'
  workflow_dispatch:  # manual button for rebuilding a release

# Serialize runs so two quick merges (or a branch+tag push) can't race the
# version calculation or double-create a release.
concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  # ── Determine version ────────────────────────────────────────────────────────
  # The tag being built is the version. The patch-bump fallback is kept only for
  # workflow_dispatch, which can run without a tag; a tag push always takes the
  # first branch.
  version:
    runs-on: ubuntu-latest
    permissions:
      # read, not write: nothing here pushes any more. The tag-minting
      # fallback that needed write is gone, and its absence is the point --
      # a job that cannot push a tag cannot invent a release.
      contents: read
    outputs:
      version: ${{ steps.calc.outputs.version }}

    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Belt and braces against the trigger change above.
      #
      # This is a POLICY gate, not a build input. Makefile.debian's VERSION is
      # metadata (see its own comment: "pkg-config reports it, nothing links
      # against it"), and the build overrides it below with the tag's version
      # anyway. What it records is whether the tree considers itself finished:
      # a tilde or a hyphen marks a pre-release, and 2.0.0~dev sorts below
      # 2.0.0 to both dpkg and pkg-config. If the tree says it is not ready, a
      # pushed tag does not make it ready.
      #
      # It must fail CLOSED. An earlier version of this step parsed with a
      # narrow sed and let `case` fall through on an empty result, so a
      # `VERSION :=` form, a leading space, or a renamed file silently passed
      # and would have shipped the pre-release.
      - name: Refuse to release a pre-release version
        run: |
          set -euo pipefail

          if [ ! -f Makefile.debian ]; then
            echo "::error::Makefile.debian not found; cannot verify the tree is releasable."
            exit 1
          fi

          # Accepts `VERSION = x`, `?=`, `:=`, `::=`, and leading whitespace.
          TREE_VERSION=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]*:?:?\??=[[:space:]]*([^[:space:]#]+).*/\1/p' \
                         Makefile.debian | head -1)

          if [ -z "$TREE_VERSION" ]; then
            echo "::error::Could not read VERSION from Makefile.debian. Refusing to release rather than assuming it is releasable."
            exit 1
          fi

          echo "Makefile.debian declares VERSION=${TREE_VERSION}"

          case "$TREE_VERSION" in
            *"~"*|*-*)
              echo "::error::Refusing to release: VERSION is '${TREE_VERSION}', a pre-release. Set a final version before tagging."
              exit 1
              ;;
          esac

      - name: Calculate version
        id: calc
        run: |
          set -euo pipefail

          # A tag push is authoritative: use the ref being built, not a search.
          # Searching by refname sort would resolve v1.9.9 over a freshly
          # pushed v2.0.0 on the same commit, and publish the new artifacts to
          # the old release.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            EXISTING="${GITHUB_REF_NAME}"
          else
            # workflow_dispatch. Rebuilding an existing release is fine;
            # minting a NEW one from the button is what produced the deleted
            # v1.3.2, so require the dispatched ref to carry a tag.
            #
            # The `|| true` matters: grep exits 1 when nothing matches, which
            # is the expected case here, and under `-o pipefail` that aborts
            # the assignment before the message below can print. The guard
            # still failed closed without it, but the operator saw a bare exit
            # code instead of being told what to do.
            EXISTING=$(git tag --points-at HEAD \
                       | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
                       | head -1)
            if [ -z "$EXISTING" ]; then
              echo "::error::workflow_dispatch on a commit with no vX.Y.Z tag. This workflow rebuilds an existing release; it does not create one. Push a tag deliberately, or dispatch against a tag ref."
              exit 1
            fi
          fi

          # Validate the TAG, not just the tree.
          #
          # The trigger filter `v*.*.*` is an fnmatch glob, not a regex: `*`
          # matches any character except `/`, so `v2.0.0-rc1` matches it and
          # fires this workflow. Before this job trusted GITHUB_REF_NAME it
          # searched with this same strict regex, which filtered such tags out
          # by accident. Taking the ref directly removed that filter and left
          # a pre-release tag able to publish as a stable release, with
          # `prerelease: false`, whenever the tree's own VERSION was final.
          if ! printf '%s' "$EXISTING" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Refusing to release '${EXISTING}': not a final vX.Y.Z tag. Pre-release tags (v2.0.0-rc1, v2.0.0~rc1) are rejected here because this workflow publishes with prerelease: false."
            exit 1
          fi

          VERSION="${EXISTING#v}"
          echo "Releasing ${EXISTING}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # ── Linux packages ──────────────────────────────────────────────────────────
  # amd64 (Debian / Ubuntu / Linux Mint) and arm64 (Raspberry Pi 4/5 on a
  # 64-bit OS) were two copy-pasted jobs that differed only in platform,
  # Architecture and one Description line. They had already drifted apart once,
  # which is how the Depends: field went stale in both at the same time — a
  # matrix makes that failure mode structurally impossible.
  build-linux:
    runs-on: ubuntu-latest
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            qemu: false
          - arch: arm64
            platform: linux/arm64
            qemu: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ONLY tinyxml2. base.mk compiles it into the library, so Dockerfile.debian
      # cannot build without it -- but `submodules: true` would also fetch the
      # Android SDL trees (SDL2, SDL_image2, SDL_mixer2, SDL_ttf2) and glm, ~585 MB
      # that nothing in this image builds and .dockerignore excludes anyway.
      - name: Fetch the vendored tinyxml2
        run: git submodule update --init --depth 1 vendor/android/tinyxml2

      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: |
          docker build -t stormenginev2:linux-${{ matrix.arch }} \
            --platform=${{ matrix.platform }} \
            --no-cache \
            . -f Dockerfile.debian

      - name: Run tests
        run: |
          docker run --rm --platform=${{ matrix.platform }} \
            stormenginev2:linux-${{ matrix.arch }}

      # Three things happen in the container, all of which used to happen on the
      # runner or not at all:
      #
      #  * PROFILE=release swaps base.mk's unconditional -g for -O2 and strip
      #    drops the symbol table. The shipped .deb was an unoptimized,
      #    unstripped -O0 build while the Switch path was already -O2.
      #  * `make install DESTDIR=...` replaces a hand-rolled `cp -r common/*`.
      #    The staged tree and the tree `sudo make install` produces are now
      #    the same code path, and it wipes the include dir first so
      #    directories deleted from common/ stop accumulating there.
      #  * dpkg-shlibdeps derives Depends: from the binary instead of a
      #    hand-maintained list. The old list claimed SDL2_ttf and SDL2_mixer
      #    (never linked — --as-needed drops them) and omitted tinyxml2, which
      #    IS linked: the package installed cleanly on a fresh machine and then
      #    failed to load. It has to run inside the container because it maps
      #    sonames to packages through the local dpkg database — the answer is
      #    both architecture- and distro-specific (libtinyxml2.so.6 is shipped
      #    by `libtinyxml2-6a`, not by `libtinyxml2-6`).
      - name: Build library, stage the package tree and derive Depends
        run: |
          docker run --name build_${{ matrix.arch }} \
            --platform=${{ matrix.platform }} \
            stormenginev2:linux-${{ matrix.arch }} \
            sh -c 'set -e
              make PROFILE=release target
              strip --strip-unneeded bin/libstormenginev2.so
              make install DESTDIR=/opt/library/pkg VERSION=${{ needs.version.outputs.version }}
              readelf -d bin/libstormenginev2.so | grep NEEDED
              mkdir -p debian
              printf "Source: libstormenginev2\n\nPackage: libstormenginev2\nArchitecture: any\n" > debian/control
              dpkg-shlibdeps -O --ignore-missing-info pkg/usr/local/lib/libstormenginev2.so \
                | sed -n "s/^shlibs:Depends=//p" > pkg/DEPENDS'

          mkdir -p deb
          docker cp build_${{ matrix.arch }}:/opt/library/pkg/usr ./deb/
          docker cp build_${{ matrix.arch }}:/opt/library/pkg/DEPENDS ./DEPENDS
          docker rm build_${{ matrix.arch }}

          ls -l deb/usr/local/lib/libstormenginev2.so

      - name: Check the derived dependencies
        id: deps
        run: |
          DEPENDS=$(cat DEPENDS)
          echo "Depends: ${DEPENDS}"

          if [ -z "${DEPENDS}" ]; then
            echo "::error::dpkg-shlibdeps produced no dependencies"
            exit 1
          fi

          # THIS GUARD WAS INVERTED, and the reason matters more than the flip.
          #
          # It used to demand tinyxml2 be PRESENT: it was linked by
          # common/xmlLoader.cpp and missing from the shipped Depends: for every
          # release up to v1.2.1, so the package installed cleanly and then
          # failed to load. That was a real bug and this caught it.
          #
          # The fix for it was the wrong shape, and v2.1.0 is where that came
          # due. Debian numbers tinyxml2 by ABI -- libtinyxml2-6a, -8, -9, -10 --
          # so an honest Depends: names whichever the BUILD CONTAINER has, and
          # the package then refuses to configure on every distro carrying a
          # different one. v2.1.0 shipped depending on libtinyxml2-8; Ubuntu
          # 24.04 / Mint 22 have libtinyxml2-10 and no -8 candidate at all, so
          # the .deb could not be installed there.
          #
          # tinyxml2 is now compiled into the library from vendor/android/tinyxml2
          # (see base.mk), so it must NOT appear here. Every remaining soname is
          # stable across distros, which is what makes one .deb portable.
          case "${DEPENDS}" in
            *tinyxml2*)
              echo "::error::tinyxml2 is back in the derived Depends: -- the library is linking the system copy again instead of compiling in vendor/android/tinyxml2, and this .deb will not install off the build container's distro"
              exit 1
              ;;
          esac

          echo "depends=${DEPENDS}" >> "$GITHUB_OUTPUT"

      - name: Build the .deb
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          DEPENDS: ${{ steps.deps.outputs.depends }}
        run: |
          mkdir -p deb/DEBIAN
          printf '#!/bin/sh\nset -e\nldconfig\n' > deb/DEBIAN/postinst
          chmod 0755 deb/DEBIAN/postinst

          {
            echo "Package: libstormenginev2"
            echo "Version: ${VERSION}"
            echo "Section: libs"
            echo "Priority: optional"
            echo "Architecture: ${ARCH}"
            echo "Depends: ${DEPENDS}"
            echo "Maintainer: Will Sams <will@samswebs.com>"
            echo "Homepage: https://github.com/WillSams/storm-engine-v2"
            echo "Description: Storm Engine v2 - C++ 2-D game-engine library"
            echo " A lightweight ECS-based 2-D game engine built on SDL2."
            echo " Provides entity/component/system management, asset loading,"
            echo " tilemap support, and game-state machine."
            if [ "${ARCH}" = "arm64" ]; then
              echo " ."
              echo " This build targets arm64 / AArch64 (Raspberry Pi 4/5 with 64-bit OS)."
            fi
          } > deb/DEBIAN/control

          cat deb/DEBIAN/control
          dpkg-deb --build deb "libstormenginev2_${VERSION}_${ARCH}.deb"

      # ── THE CHECK THAT WAS MISSING ──────────────────────────────────────
      #
      # Everything above verifies the .deb is well FORMED. Nothing verified it
      # could be INSTALLED, and for v2.0.0 and v2.1.0 it could not be -- on any
      # distro whose tinyxml2 ABI differed from the build container's, which by
      # then was every current Ubuntu and Mint. Both releases went out green.
      #
      # `apt-get install ./file.deb` resolves the package's own Depends:, so a
      # dependency this distro cannot satisfy fails the job here instead of on
      # a user's machine. The ldd pass is the second half and not redundant: a
      # package whose Depends: is merely INCOMPLETE installs happily and then
      # fails to load, which is the v1.2.1 bug, so both halves guard a failure
      # that has actually shipped.
      #
      # Bullseye is the floor because the build image is that vintage; noble is
      # the ceiling that v2.1.0 could not reach.
      - name: Verify the .deb installs and loads on real distros
        if: matrix.arch == 'amd64'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -e
          for image in debian:bullseye debian:bookworm ubuntu:22.04 ubuntu:24.04; do
            echo "::group::${image}"
            docker run --rm -v "$PWD:/w" -w /w "${image}" sh -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq ./libstormenginev2_'"${VERSION}"'_amd64.deb
              missing=$(ldd /usr/local/lib/libstormenginev2.so | grep "not found" || true)
              if [ -n "${missing}" ]; then
                echo "unresolved after install:"
                echo "${missing}"
                exit 1
              fi
              echo "OK: installed and fully resolved"
            ' || { echo "::error::the .deb does not install cleanly on ${image}"; exit 1; }
            echo "::endgroup::"
          done

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: libstormenginev2_${{ needs.version.outputs.version }}_${{ matrix.arch }}.deb

  # ── Windows (MinGW-w64 cross-compile) ────────────────────────────────────────
  #
  # Cross-built from Linux, not built on a windows runner: Makefile.win is a
  # cross-compile and its deps come from the SAME vendored SDL sources Android
  # uses, so Windows cannot drift to a different SDL than the other targets.
  # A windows-latest runner would need its own SDL provisioning and would be
  # the only target whose dependencies came from somewhere else.
  #
  # This is slower than the Linux legs because the first (and here, only) run
  # cross-builds SDL2, SDL_image, SDL_ttf, SDL_mixer and tinyxml2 from source.
  # It runs on tag push only, like everything else in this workflow.
  build-windows:
    runs-on: ubuntu-latest
    needs: version

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Windows needs MORE of vendor/android than Linux does: Makefile.win
      # cross-builds SDL2 and satellites from these trees, and its CXXFLAGS
      # name vendor/android/glm directly. This is the one job that wants the
      # blanket form.
      - name: Fetch vendored sources
        run: git submodule update --init --depth 1 vendor/android

      - name: Install the cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 cmake zip

      - name: Build the SDK zip
        run: make -f Makefile.win dist VERSION=${{ needs.version.outputs.version }}

      # The .deb's failure mode was shipping something that could not be
      # installed. The Windows equivalent is shipping a zip missing a DLL or a
      # header, which nobody notices until a consumer's link fails, so assert
      # the shape here rather than trusting the recipe.
      - name: Verify the zip's contents
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -e
          ZIP="build/win/stormengine2-${VERSION}-win64.zip"
          test -f "${ZIP}" || { echo "::error::${ZIP} was not produced"; exit 1; }

          rm -rf /tmp/winverify && mkdir -p /tmp/winverify
          unzip -q "${ZIP}" -d /tmp/winverify
          ROOT="/tmp/winverify/stormengine2-${VERSION}-win64"

          for f in bin/libstormenginev2.dll \
                   lib/libstormenginev2.dll.a \
                   include/stormengine2/assetStore.h \
                   include/stormengine2/tinyxml2.h \
                   include/SDL2/SDL.h \
                   include/glm/glm.hpp \
                   template/Makefile \
                   README.txt; do
            test -f "${ROOT}/${f}" || { echo "::error::missing from the zip: ${f}"; exit 1; }
          done

          # No stray build output in the shipped headers.
          if find "${ROOT}/include/stormengine2" \( -name '*.o' -o -name '*.cpp' \) | grep -q .; then
            echo "::error::build artifacts leaked into include/stormengine2"
            exit 1
          fi

          # Every DLL the engine imports must be present in bin/. This is the
          # check that matters: a missing DLL gives no useful message on
          # Windows, and the staged set is derived, not hardcoded.
          missing=0
          for n in $(x86_64-w64-mingw32-objdump -p "${ROOT}/bin/libstormenginev2.dll" \
                     | awk '/DLL Name/ {print $3}' | sort -u); do
            case "${n}" in
              # Shipped by Windows itself.
              KERNEL32.dll|USER32.dll|msvcrt.dll|ADVAPI32.dll|WS2_32.dll|SHELL32.dll|ole32.dll|OLEAUT32.dll|GDI32.dll|IMM32.dll|WINMM.dll|VERSION.dll|SETUPAPI.dll|CFGMGR32.dll|RPCRT4.dll|bcrypt.dll) ;;
              *)
                if [ ! -f "${ROOT}/bin/${n}" ]; then
                  echo "::error::libstormenginev2.dll imports ${n}, which is not in bin/"
                  missing=1
                fi
                ;;
            esac
          done
          [ "${missing}" -eq 0 ] || exit 1

          echo "zip verified:"
          find "${ROOT}/bin" -name '*.dll' -printf '  %f\n' | sort

      # examples/examples.win.mk is a complete Windows build for the examples and
      # was DEAD CODE until this branch: it is an include file, its header says
      # "an example Makefile sets NAME and then does include ../examples.win.mk",
      # and not one example had a Makefile.win to do that. Nothing referenced it
      # from CI, the README or any script either, so it could not rot loudly.
      #
      # Seven of the eleven examples, and the four absences are all deliberate:
      #
      #   nx-platformer, android-platformer  devkitPro / Android NDK, neither on
      #                                      this runner.
      #   netchat, netplay-checkers          POSIX non-blocking stdin, which
      #                                      MinGW does not provide for console
      #                                      handles -- select() on
      #                                      STDIN_FILENO and fcntl(O_NONBLOCK)
      #                                      respectively. NOT a networking
      #                                      limit: netrepl uses the same net
      #                                      module and builds fine.
      #
      # Every example that CAN build is built, rather than a representative
      # sample. The thing being guarded is a path nobody exercised for so long
      # that it did not work at all, and a subset would leave most of it exactly
      # as unexercised as it was. The deps are already built by the step above,
      # so the marginal cost is the engine plus a few example TUs each.
      - name: Build the examples for Windows
        run: |
          set -e
          for ex in jrpg netrepl platformer puzzle shooter sports strategy; do
            echo "::group::${ex}"
            make -C "examples/${ex}" -f Makefile.win
            test -f "examples/${ex}/bin/win/${ex}.exe" \
              || { echo "::error::examples/${ex} produced no .exe"; exit 1; }
            echo "::endgroup::"
          done

      # The one thing that consumes the ZIP rather than the build tree. It runs
      # AFTER the shape checks because it proves something they cannot: that the
      # package is usable, not merely well formed. Both defects it has already
      # caught -- missing SDL2 import libraries, and the DLL re-exporting
      # _Unwind_Resume -- passed every check above.
      - name: Build windows-platformer against the packaged SDK
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -e
          make -C examples/windows-platformer VERSION="${VERSION}"
          EXE=examples/windows-platformer/bin/win/windows-platformer.exe
          test -f "$EXE" || { echo "::error::windows-platformer produced no .exe"; exit 1; }
          # It must link the engine DLL. If it ever static-links the engine
          # again, it stops testing the package.
          x86_64-w64-mingw32-objdump -p "$EXE" \
            | grep -q 'libstormenginev2.dll' \
            || { echo "::error::windows-platformer does not import libstormenginev2.dll"; exit 1; }

      - name: Upload the SDK zip
        uses: actions/upload-artifact@v7
        with:
          name: win64
          path: build/win/stormengine2-${{ needs.version.outputs.version }}-win64.zip

  # ── GitHub Release ───────────────────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [version, build-linux, build-windows]

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "{deb-*,win64}"
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ needs.version.outputs.version }}
          tag_name: v${{ needs.version.outputs.version }}
          body: |
            ## Storm Engine v2  —  v${{ needs.version.outputs.version }}

            ### Installation

            **Debian / Ubuntu / Linux Mint (amd64)**
            ```bash
            sudo dpkg -i libstormenginev2_${{ needs.version.outputs.version }}_amd64.deb
            ```

            **Raspberry Pi 4/5 with 64-bit OS (arm64)**
            ```bash
            sudo dpkg -i libstormenginev2_${{ needs.version.outputs.version }}_arm64.deb
            ```

            After installing, link with `-lstormenginev2`.

            **Windows (x64, MinGW-w64)**

            Download `stormengine2-${{ needs.version.outputs.version }}-win64.zip`
            and unzip it. It carries the DLLs, the import library, and the
            SDL2, glm and tinyxml2 headers the engine's own headers need —
            Windows has no package manager to fetch those from.

            ```
            g++ -std=c++17 mygame.cpp -Iinclude -Llib -lstormenginev2 -o mygame.exe
            ```

            Then put the contents of `bin\\` beside your `.exe`. MSVC is not
            supported: the import library and C++ ABI are GCC's. See the
            `README.txt` inside the zip.
          files: |
            libstormenginev2_${{ needs.version.outputs.version }}_amd64.deb
            libstormenginev2_${{ needs.version.outputs.version }}_arm64.deb
            stormengine2-${{ needs.version.outputs.version }}-win64.zip
          prerelease: false
