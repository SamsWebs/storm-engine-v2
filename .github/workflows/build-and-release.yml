name: Build And Release Multiplatform

on:
  push:
    branches:
      - main

jobs:
  # ── Determine version ────────────────────────────────────────────────────────
  # If the merge commit already carries a tag (major/minor bump you pushed
  # manually), use it.  Otherwise find the latest vX.Y.Z tag and bump patch.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.calc.outputs.version }}

    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: calc
        run: |
          # Check whether the current commit is already tagged with vX.Y.Z
          EXISTING=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)

          if [ -n "$EXISTING" ]; then
            # You pushed a manual major/minor tag — use it as-is
            VERSION="${EXISTING#v}"
            echo "Using existing tag: $EXISTING"
          else
            # Find the latest vX.Y.Z tag anywhere in history
            LATEST=$(git tag --list 'v*.*.*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -1)

            if [ -z "$LATEST" ]; then
              # No tags yet — start at v0.0.1
              VERSION="0.0.1"
            else
              # Bump the patch component
              MAJOR=$(echo "$LATEST" | cut -d. -f1 | tr -d 'v')
              MINOR=$(echo "$LATEST" | cut -d. -f2)
              PATCH=$(echo "$LATEST" | cut -d. -f3)
              VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi

            echo "Bumping from ${LATEST:-none} → v${VERSION}"

            # Create and push the new tag
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # ── amd64 (Debian / Ubuntu / Linux Mint) ────────────────────────────────────
  build-amd64-linux:
    runs-on: ubuntu-latest
    needs: version

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: |
          docker build -t stormenginev2:linux-amd64 \
            --platform=linux/amd64 \
            --no-cache \
            . -f Dockerfile.debian

      - name: Run tests
        run: docker run --rm stormenginev2:linux-amd64

      - name: Build library and create .deb
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker run --name build_amd64 stormenginev2:linux-amd64 make target
          docker cp build_amd64:/opt/library/bin/libstormenginev2.so ./libstormenginev2.so
          docker cp build_amd64:/opt/library/common ./common
          docker rm build_amd64

          mkdir -p deb/DEBIAN
          mkdir -p deb/usr/local/lib
          mkdir -p deb/usr/local/include/stormengine2

          cp libstormenginev2.so deb/usr/local/lib/
          cp -r common/* deb/usr/local/include/stormengine2/
          find deb/usr/local/include/stormengine2 -name "*.o" -delete
          find deb/usr/local/include/stormengine2 -name "*.cpp" -delete

          printf '#!/bin/sh\nset -e\nldconfig\n' > deb/DEBIAN/postinst
          chmod 0755 deb/DEBIAN/postinst

          printf "Package: libstormenginev2\nVersion: ${VERSION}\nSection: libs\nPriority: optional\nArchitecture: amd64\nDepends: libsdl2-2.0-0, libsdl2-image-2.0-0, libsdl2-ttf-2.0-0, libsdl2-mixer-2.0-0\nMaintainer: Will Sams <will@samswebs.com>\nHomepage: https://github.com/storminator16/storm-engine-v2\nDescription: Storm Engine v2 - C++ 2-D game-engine library\n A lightweight ECS-based 2-D game engine built on SDL2.\n Provides entity/component/system management, asset loading,\n tilemap support, and game-state machine.\n" > deb/DEBIAN/control

          dpkg-deb --build deb "libstormenginev2_${VERSION}_amd64.deb"

      - name: Upload amd64 .deb
        uses: actions/upload-artifact@v7
        with:
          name: deb-amd64
          path: libstormenginev2_${{ needs.version.outputs.version }}_amd64.deb

  # ── arm64 (Raspberry Pi 4/5 with 64-bit OS) ─────────────────────────────────
  build-arm64-linux:
    runs-on: ubuntu-latest
    needs: version

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (arm64)
        run: |
          docker build -t stormenginev2:linux-arm64 \
            --platform=linux/arm64 \
            --no-cache \
            . -f Dockerfile.debian

      - name: Run tests (arm64)
        run: docker run --rm --platform=linux/arm64 stormenginev2:linux-arm64

      - name: Build library and create .deb
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker run --name build_arm64 --platform=linux/arm64 \
            stormenginev2:linux-arm64 make target
          docker cp build_arm64:/opt/library/bin/libstormenginev2.so ./libstormenginev2.so
          docker cp build_arm64:/opt/library/common ./common
          docker rm build_arm64

          mkdir -p deb/DEBIAN
          mkdir -p deb/usr/local/lib
          mkdir -p deb/usr/local/include/stormengine2

          cp libstormenginev2.so deb/usr/local/lib/
          cp -r common/* deb/usr/local/include/stormengine2/
          find deb/usr/local/include/stormengine2 -name "*.o" -delete
          find deb/usr/local/include/stormengine2 -name "*.cpp" -delete

          printf '#!/bin/sh\nset -e\nldconfig\n' > deb/DEBIAN/postinst
          chmod 0755 deb/DEBIAN/postinst

          printf "Package: libstormenginev2\nVersion: ${VERSION}\nSection: libs\nPriority: optional\nArchitecture: arm64\nDepends: libsdl2-2.0-0, libsdl2-image-2.0-0, libsdl2-ttf-2.0-0, libsdl2-mixer-2.0-0\nMaintainer: Will Sams <will@samswebs.com>\nHomepage: https://github.com/storminator16/storm-engine-v2\nDescription: Storm Engine v2 - C++ 2-D game-engine library\n A lightweight ECS-based 2-D game engine built on SDL2.\n Provides entity/component/system management, asset loading,\n tilemap support, and game-state machine.\n .\n This build targets arm64 / AArch64 (Raspberry Pi 4/5 with 64-bit OS).\n" > deb/DEBIAN/control

          dpkg-deb --build deb "libstormenginev2_${VERSION}_arm64.deb"

      - name: Upload arm64 .deb
        uses: actions/upload-artifact@v7
        with:
          name: deb-arm64
          path: libstormenginev2_${{ needs.version.outputs.version }}_arm64.deb

  # ── GitHub Release ───────────────────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [version, build-amd64-linux, build-arm64-linux]

    steps:
      - name: Download amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: deb-amd64

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: deb-arm64

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          VERSION: ${{ needs.version.outputs.version }}
        with:
          name: v${{ needs.version.outputs.version }}
          tag_name: v${{ needs.version.outputs.version }}
          body: |
            ## Storm Engine v2  —  v${{ needs.version.outputs.version }}

            ### Installation

            **Debian / Ubuntu / Linux Mint (amd64)**
            ```bash
            sudo dpkg -i libstormenginev2_${{ needs.version.outputs.version }}_amd64.deb
            ```

            **Raspberry Pi 4/5 with 64-bit OS (arm64)**
            ```bash
            sudo dpkg -i libstormenginev2_${{ needs.version.outputs.version }}_arm64.deb
            ```

            After installing, link with `-lstormenginev2`.
          files: |
            libstormenginev2_${{ needs.version.outputs.version }}_amd64.deb
            libstormenginev2_${{ needs.version.outputs.version }}_arm64.deb
          prerelease: false
