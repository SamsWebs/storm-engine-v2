name: Build And Release Multiplatform

on: [push]

jobs:
  build-amd64-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Build Docker image for Testing
        run: |
          docker build -t stormenginev2:linux-amd64 \
            --platform=linux/amd64 \
            --no-cache \
            . -f Dockerfile.debian
          docker run --rm -t stormenginev2:linux-amd64

      - name: Prepares artifacts
        run: |
          make -f Makefile.debian
          mkdir archives
          cd bin
          zip -r ../archives/stormenginev2-linux-amd64.zip libstormenginev2.so

      - name: Save build-artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: |
            archives/stormenginev2-linux-amd64.zip

  build-arm64-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up QEMU dependency
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Build Docker image for Testing
        run: |
          docker build -t stormenginev2:linux-arm64 \
            --platform=linux/arm64 \
            --no-cache \
            . -f Dockerfile.debian
          docker run --rm -t stormenginev2:linux-amd64

      - name: Prepares artifacts
        run: |
          make all -f Makefile.debian
          mkdir archives
          cd bin
          zip -r ../archives/stormenginev2-linux-arm64.zip libstormenginev2.so

      - name: Save build-artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: |
            archives/stormenginev2-linux-arm64.zip

