name: PR Validate

on:
  pull_request:

jobs:
  test-amd64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        run: |
          docker build -t stormenginev2-test:amd64 \
            --platform=linux/amd64 \
            --no-cache \
            . -f Dockerfile.debian

      - name: Run tests
        run: docker run --rm stormenginev2-test:amd64
