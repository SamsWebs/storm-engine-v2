name: PR Validate

on:
  pull_request:

jobs:
  test-amd64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ONLY tinyxml2. base.mk compiles it into the library, so Dockerfile.debian
      # cannot build without it -- but `submodules: true` would also fetch the
      # Android SDL trees (SDL2, SDL_image2, SDL_mixer2, SDL_ttf2) and glm, ~585 MB
      # that nothing in this image builds and .dockerignore excludes anyway.
      - name: Fetch the vendored tinyxml2
        run: git submodule update --init --depth 1 vendor/android/tinyxml2

      # The generated probe is what makes specs/compat/global.spec.cpp able to
      # fail. It is committed so the spec suite needs no Python, which means it
      # can go stale -- a public name added to the engine and not regenerated
      # here would leave the bridge unchecked again, which is the exact hole
      # this replaced. Runs on the host: it is stdlib Python over the headers
      # and needs no toolchain.
      - name: Check the compat probe is not stale
        run: python3 scripts/generate-compat-probes.py --check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        run: |
          docker build -t stormenginev2-test:amd64 \
            --platform=linux/amd64 \
            --no-cache \
            . -f Dockerfile.debian

      - name: Run tests
        run: docker run --rm stormenginev2-test:amd64

      # The examples and the editor consume the engine the way a game does, so
      # they catch API breakage the spec suite does not. See the script header
      # for what it covers — notably the editor is compile-only (libnfd has no
      # Debian package) and the devkitPro / Android example trees are not built
      # at all, because neither toolchain is in the image.
      - name: Build examples and compile the editor
        run: |
          docker run --rm -i stormenginev2-test:amd64 \
            sh -s < .github/scripts/ci-build-examples.sh
